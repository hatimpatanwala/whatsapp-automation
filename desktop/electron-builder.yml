appId: com.beatroute.wacommerce.erp
productName: NexusFlow
copyright: Copyright © NexusFlow

# The embedded NestJS backend runs as its own Node process (Node ABI), so native
# modules must NOT be rebuilt against Electron's ABI. Auth now uses pure-JS
# bcryptjs and the only other native dep (msgpackr-extract) has a JS fallback,
# so skip the native rebuild (this machine also lacks the C toolchain for it).
npmRebuild: false

directories:
  output: release
  buildResources: build

# The Electron app itself (main/preload/etc.). CRITICAL: exclude the
# `whatsapp-automation` production dep — it's a `file:..` symlink back to the repo
# root (used only for local dev types; the backend is bundled via extraResources
# below). Without this, electron-builder follows the symlink and tries to package
# the ENTIRE repo root, failing on every non-app file (.dockerignore, .claude, …).
files:
  - dist/**/*
  - package.json
  - '!**/node_modules/whatsapp-automation/**'
  - '!**/node_modules/whatsapp-automation'

# embedded-postgres ships real Postgres binaries that must live on disk (not inside
# app.asar) so they can be spawned.
asarUnpack:
  - '**/node_modules/embedded-postgres/**'
  - '**/node_modules/@embedded-postgres/**'

# Bundle the NestJS backend + the Angular build under resources/backend so paths.ts
# (packaged branch → process.resourcesPath/backend) resolves them.
extraResources:
  - from: ../dist
    to: backend/dist
  - from: ../node_modules
    to: backend/node_modules
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/*.md'
      - '!**/test/**'
      - '!**/tests/**'
  - from: ../package.json
    to: backend/package.json
  - from: ../frontend/dist/wa-commerce/browser
    to: backend/frontend/dist/wa-commerce/browser

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  # Code signing: electron-builder reads CSC_LINK (cert path/URL) + CSC_KEY_PASSWORD from
  # the environment. For an EV cert on a token, set win.certificateSubjectName instead.
  # signingHashAlgorithms: ['sha256']

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexusFlow

# Auto-update feed (npm run release publishes here). Swap provider to `github` to use
# GitHub Releases instead.
publish:
  - provider: generic
    url: https://staging-whatsappdemo.duckdns.org/desktop-updates/
